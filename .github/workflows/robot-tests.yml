name: Robot Framework tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Browser Library browsers
        run: rfbrowser init

      - name: Run all Robot Framework tests
        run: xvfb-run --auto-servernum robot --outputdir results tests
        env:
          CAT_API_KEY: ${{ secrets.CAT_API_KEY }}

      - name: Upload Robot Framework reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-reports
          path: |
            results/output.xml
            results/log.html
            results/report.html
          if-no-files-found: warn
